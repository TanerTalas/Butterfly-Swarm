<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanat Detay Laboratuvarı</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #11151d; }
      canvas { display: block; }

      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .label {
        position: absolute;
        top: 0;
        left: 0;
        text-align: center;
        font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace;
        color: #8e98aa;
        white-space: nowrap;
        transition: opacity 0.2s;
      }
      .label b { display: block; color: #e0a458; font-weight: 600; }
      .label span { font-size: 11px; color: #6b7486; }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font: 12px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
        color: #7e8899;
        pointer-events: none;
      }
      #hud b { color: #c8d0dd; }
      #hud a { color: #e0a458; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <div id="hud">
      <b>Kanat Detay Laboratuvarı</b> — hareketsiz kelebekler, soldan sağa artan detay<br />
      sürükle: döndür &nbsp;·&nbsp; tekerlek: yakınlaş &nbsp;·&nbsp;
      <a href="/">← sürüye dön</a>
    </div>
    <script type="module" src="/src/lab/main.js"></script>
  </body>
</html>
