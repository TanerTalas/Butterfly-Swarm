<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e7cfc6" />
    <title>Sakura Çayırı</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Sürü sayfasının aksine burada arka plan CSS'ten gelmiyor:
         gökyüzü gerçek ve scene.background olarak çiziliyor. */
      html, body { height: 100%; overflow: hidden; background: #e7cfc6; }
      canvas { display: block; }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        font: 12px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
        color: #4a3b38;
        pointer-events: none;
        user-select: none;
        text-shadow: 0 1px 3px rgba(255, 255, 255, 0.6);
      }
      #hud b { color: #2c2220; font-weight: 600; }
      #hud a { color: #a04f63; pointer-events: auto; }

      @media (max-width: 620px) {
        #hud .wide { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <b>Sakura Çayırı</b>
      <span class="wide">— sürükle: döndür &nbsp;·&nbsp; tekerlek: yakınlaş</span>
      &nbsp;·&nbsp; <a href="/index.html">sürü →</a>
      &nbsp;·&nbsp; <a href="/lab.html">kanat laboratuvarı →</a><br />
      <span id="stats"></span>
    </div>
    <script type="module" src="/src/world/main.js"></script>
  </body>
</html>
